services:
  bookworm:
    build: .
    command: ["--http", "--host", "0.0.0.0"]
    environment:
      BOOKWORM_LOCALE: ${BOOKWORM_LOCALE:-en}
    ports:
      - "127.0.0.1:${BOOKWORM_HTTP_PORT:-9292}:9292"
      - "127.0.0.1:${BOOKWORM_HTTPS_PORT:-9443}:9443"
    volumes:
      - ${BOOKWORM_BOOKS_DIR:-./books}:/books:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - ruby
        - -rnet/http
        - -e
        - 'exit(Net::HTTP.get_response(URI("http://127.0.0.1:9292/health")).is_a?(Net::HTTPSuccess) ? 0 : 1)'
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
