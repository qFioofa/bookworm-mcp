    relation_cues:
      IS_A:
      - "\\b(?:is|are|was|were)\\s+(?:a|an|the)\\b"
      CAUSES:
      - "\\b(?:causes?|leads?\\s+to|results?\\s+in|produces?|creates?)\\b"
      CONTRASTS:
      - "\\b(?:contrasts?\\s+with|differs?\\s+from|opposed\\s+to|unlike)\\b"
      INCLUDES:
