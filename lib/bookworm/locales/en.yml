---
en:
  server:
    instructions: |
      Bookworm is a retrieval-only server for book analysis.

      It searches books and text fragments and returns ranked passages with citations,
      offsets, and score breakdowns. It never evaluates a book, ranks ideas by quality,
      or writes an answer. Use read_passage to inspect a hit, find_quote to verify a
      quotation, and ingest_text for an ad-hoc fragment.

      Graph tools expose rule-based entity and relation links extracted from the text.
      Those links are descriptive, not judgments of truth or quality.
  cli:
    usage: 'Usage: bookworm-mcp [options]'
    version: Print version and exit
    max_inline_bytes: Maximum inline text size
    default_ttl: Default lifetime for inline text
    locale: Interface locale (en, ru)
    http: Serve MCP over HTTP and HTTPS instead of stdio
    https: Also listen with TLS (default true; use --no-https to disable)
    host: HTTP bind host (default 127.0.0.1)
    port: HTTP bind port (default 9292)
    https_port: HTTPS bind port (default 9443)
    path: MCP endpoint path (default /mcp)
    allowed_hosts: Extra allowed Host headers, comma-separated
    ssl_cert: Path to a TLS certificate in PEM format
    ssl_key: Path to a TLS private key in PEM format
    help: Show this help
  http:
    listening: "Bookworm MCP server listening on %{url}"
    self_signed: "No TLS certificate configured; using a generated self-signed certificate."
  tools:
    ingest_book:
      title: Ingest book
      description: Parse a local EPUB, PDF, FB2, DjVu, Markdown, or TXT book into
        an in-memory searchable document.
    ingest_text:
      title: Ingest text fragment
      description: Create an ephemeral in-memory document from inline text. Use it
        for a passage, an article, or a fragment that is not a book.
    list_documents:
      title: List documents
      description: List books and text fragments currently held in memory.
    get_document:
      title: Get document
      description: Return document metadata and a shallow outline.
    get_outline:
      title: Get outline
      description: Return the chapter and section tree for a book or text fragment.
    read_passage:
      title: Read passage
      description: Read a passage by id, with optional neighbouring passages and a
        citation.
    search:
      title: Search
      description: Smart lexical search over a book, a text fragment, or all in-memory
        documents. Returns ranked passages with citations and score breakdown. It
        does not generate an answer.
    find_quote:
      title: Find quote
      description: Find an exact or normalized quote in one document or across all
        documents. Returns offsets and a verification flag.
    delete_document:
      title: Delete document
      description: Remove a document from memory.
    stats:
      title: Server stats
      description: Return in-memory document and passage counts.
    search_entities:
      title: Search entities
      description: Find extracted people, terms, and acronyms in the in-memory documents.
    get_entity:
      title: Get entity
      description: Return an entity profile with mentions, citations, relations, and
        linked examples.
    get_relations:
      title: Get relations
      description: Return a rule-based entity graph around an entity or a whole document.
        Supports JSON and PlantUML output.
    get_logical_chain:
      title: Get logical chain
      description: Find a shortest evidence-backed chain between two entities. Supports
        JSON and PlantUML output.
    find_cases:
      title: Find cases
      description: Find examples, illustrations, anecdotes, and case studies by marker,
        query, or anchor entity.
    get_case:
      title: Get case
      description: Return one example or case with its evidence, citation, and linked
        entities.
  errors:
    not_found: Resource not found
    validation_error: Invalid request
    unsupported_format: Unsupported format
    dependency_missing: A required external dependency is missing
    text_too_large: Inline text is too large
    ocr_required: OCR is required
    internal_error: Internal server error
    no_evidence: No matching evidence found
  cases:
    default_title: Example
