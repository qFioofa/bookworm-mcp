    relation_cues:
      IS_A:
      - "\\b(?:is|are|was|were)\\s+(?:a|an|the)\\b"
      CAUSES:
      - "\\b(?:causes?|leads?\\s+to|results?\\s+in|produces?|creates?)\\b"
      CONTRASTS:
      - "\\b(?:contrasts?\\s+with|differs?\\s+from|opposed\\s+to|unlike)\\b"
      INCLUDES:
      - "\\b(?:includes?|contains?|consists?\\s+of|comprises?)\\b"
      PART_OF:
      - "\\b(?:is|are|was|were)\\s+(?:a\\s+)?part\\s+of\\b"
      - "\\bbelongs?\\s+to\\b"
      INFLUENCES:
      - "\\b(?:influences?|affects?|shapes?)\\b"
      EXAMPLE_OF:
      - "\\b(?:for\\s+example|for\\s+instance|such\\s+as|e\\.g\\.)\\b"
      PRECEDES:
      - "\\b(?:precedes?|before)\\b"
    case_markers:
    - "\\bfor\\s+example\\b"
    - "\\bfor\\s+instance\\b"
    - "\\be\\.g\\.\\b"
    - "\\bsuch\\s+as\\b"
    - "\\bcase\\s+study\\b"
