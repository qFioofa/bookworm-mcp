      anecdote:
      - anecdote
      illustration:
      - illustration
  ingest:
    heading_patterns:
    - "\\A(?:chapter|part|section|book)\\b"
    - "\\A(?:chapter|part|book)\\s+[\\divxlcdm]+"
  schemas:
    path: Absolute or relative path to a local book file
    paths_batch: List of local book file paths
    title_override: Optional title override
    replace_document: Remove a previously ingested version of the same path before adding the new one
    text: Text to index
    text_inline_optional: Inline text; omit when source_path or source_url is used
    source_path_text: Local text file to read instead of inline text
    source_url_text: HTTP or HTTPS URL to read instead of inline text
    title_optional: Optional title
    language_optional: Optional ISO language code
    ttl_seconds: Ephemeral lifetime in seconds; 0 means no expiry
    limit_documents: Maximum number of documents
    document_id: Document id
    node_id: Optional node id to start from
    depth_outline: Maximum outline depth
    max_nodes_outline: Maximum number of outline nodes to return
    titles_only: Return only ids, titles, and levels; omit content ranges and counts
    min_confidence: Minimum relation confidence (default 0.5; CO_OCCURS is 0.4)
    passage_id: Passage id returned by search or ingest
    before: Number of preceding passages
    after: Number of following passages
    max_tokens_passage: Approximate token budget per passage
    node_id_chapter: Chapter or section node id returned by get_outline
    offset_chapter: Passage offset inside the chapter
    limit_chapter: Maximum number of passages to return
    include_footnotes: Include linked footnotes
    query_search: Search query; supports quoted phrases, +required terms, and -excluded
      terms
    document_id_search: Optional document id; omit to search all documents
    inline_text_search: Optional inline text to index for this search instead of document_id
    inline_title: Title for inline text
    language_inline: Language for inline text
    k: Number of results
    mode_search: smart and lexical are lexical-only; no embeddings or vector search
    cursor: Opaque pagination cursor
    include_text: Include full passage text in each hit
    verbosity_search: Response detail; compact omits highlights, breakdown, and matched terms
    include_breakdown: Include the score breakdown
    max_tokens_text: Approximate token budget for included text
    quote: Quote to find
    document_id_optional: Optional document id
    inline_text_quote: Optional inline text to search instead of document_id
    fuzzy: Also return fuzzy candidates when no exact match is found
    source_quote: Evidence source; books are preferred, text fragments are marked as ephemeral
    max_results: Maximum number of occurrences
    query_entities: Entity name or prefix; omit to list top entities
    limit_entities: Maximum number of entities
    entity_id: Entity id returned by search_entities
    entity_id_optional: Optional entity id; omit to return a document graph
    depth_relations: Neighbourhood depth
    limit_edges: Maximum number of edges
    max_nodes: Maximum number of nodes
    include_evidence: Include evidence in JSON and PlantUML
    include_url: Also return a PlantUML server URL
    start: Start entity id or name
    finish: Finish entity id or name
    max_depth: Maximum expected chain length
    query_cases: Optional search query
    anchor: Optional entity id or name
    limit_cases: Maximum number of cases
    include_case_text: Include full case text
    case_id: Case id returned by find_cases
    predicates: Optional predicate filter, for example CAUSES or IS_A
