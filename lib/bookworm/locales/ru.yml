      - воздействует
      EXAMPLE_OF:
      - например
      - к\s+примеру
      PRECEDES:
      - предшествует
      - до\s+того
      - перед
    case_markers:
    - например
    - к\s+примеру
    - "\\bпример\\w*"
    - "\\bслучай\\w*"
    - "\\bиллюстрац\\w*"
    - "\\bкейс\\w*"
    - "\\bанекдот\\w*"
    case_heading_patterns:
    - "\\b(?:пример|кейс)\\w*"
    case_kind_patterns:
      case_study:
      - кейс
      anecdote:
      - анекдот
      illustration:
      - иллюстрац
  ingest:
    heading_patterns:
    - "\\A(?:глава|часть|книга|раздел)\\b"
    - "\\A(?:глава|часть|книга)\\s+[\\divxlcdm]+"
