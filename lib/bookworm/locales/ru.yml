    - утверждает
    - является
    leading_articles:
    - это
    - этот
    - эта
    - эти
    name_connectors: []
    relation_cues:
      IS_A:
      - "\\bявляется\\b"
      - "\\bэто\\b"
      CAUSES:
      - приводит
      - вызывает
      - ведет\s+к
      - является\s+причиной
      CONTRASTS:
      - противоречит
      - отличается\s+от
      - в\s+отличие\s+от
      INCLUDES:
      - включает
      - содержит
      - состоит\s+из
      INFLUENCES:
      - влияет
      - воздействует
      EXAMPLE_OF:
      - например
      - к\s+примеру
      PRECEDES:
      - предшествует
      - до\s+того
    case_markers:
    - например
    - к\s+примеру
    - "\\bпример\\w*"
    - "\\bслучай\\w*"
    - "\\bиллюстрац\\w*"
    - "\\bкейс\\w*"
    - "\\bанекдот\\w*"
    case_heading_patterns:
    - "\\b(?:пример|кейс)\\w*"
    case_kind_patterns:
      case_study:
      - кейс
      anecdote:
      - анекдот
      illustration:
      - иллюстрац
  ingest:
    heading_patterns:
    - "\\A(?:глава|часть|книга|раздел)\\b"
    - "\\A(?:глава|часть|книга)\\s+[\\divxlcdm]+"
