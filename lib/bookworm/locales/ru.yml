---
ru:
  server:
    instructions: |
      Bookworm — сервер только для поиска и извлечения данных из книг.

      Он ищет по книгам и текстовым фрагментам и возвращает ранжированные пассажи
      с цитатами, смещениями и разбивкой оценки. Он не оценивает книгу, не ранжирует
      идеи по качеству и не пишет готовый ответ. Используйте read_passage для
      просмотра найденного фрагмента, read_chapter для чтения главы целиком,
      find_quote для проверки цитаты по оригиналу книги и ingest_text для
      временного фрагмента.

      Инструменты графа показывают извлечённые по правилам связи сущностей.
      Это описательные связи, а не суждения об истинности или качестве.

      Сценарные промпты в prompts/list описывают рекомендованные комбинации
      инструментов для поиска факта, проверки цитаты, изучения главы, профиля
      сущности, цепочки понятий, сбора кейсов, сравнения книг, пакета
      доказательств и сверки заметок. Используйте prompts/get, чтобы загрузить
      сценарий.
  scenarios:
    prompt:
      heading: "Сценарий Bookworm: %{title}"
      when: "Когда использовать"
      request: "Запрос"
      document: "Документ"
      language: "Язык ответа"
      steps: "Шаги"
      no_steps: "шаги недоступны; запросите недостающие входные данные"
      arguments: "аргументы"
      stop_when: "Критерий остановки"
      expected: "Ожидаемый результат"
      constraints: "Ограничения"
      no_document: "не указан; уточните у пользователя или определите через list_documents"
      arguments_meta:
        request:
          title: "Запрос"
          description: "Вопрос, тезис, цитата или цель анализа."
        document_id:
          title: "Идентификатор документа"
          description: "Необязательный id, чтобы ограничить сценарий одним документом."
        language:
          title: "Язык"
          description: "Необязательный язык ответа бота."
    step_notes:
      list_documents: "проверить, какие документы есть в памяти"
      stats: "получить число документов и пассажей"
      get_document: "прочитать метаданные и краткий план"
      get_outline: "пройти по дереву глав и разделов"
      read_passage: "прочитать найденный фрагмент с соседями и сносками"
      read_chapter: "прочитать главу или раздел целиком с пагинацией"
      search: "найти пассажи-кандидаты; это поиск, а не ответ"
      find_quote: "проверить цитату по разобранному тексту"
      search_entities: "найти сущности и термины-кандидаты"
      get_entity: "прочитать упоминания, связи и связанные кейсы"
      get_relations: "посмотреть граф связей вокруг сущности"
      get_logical_chain: "найти кратчайшую цепочку с доказательствами"
      find_cases: "найти примеры и кейсы по маркерам"
      get_case: "прочитать кейс и его пассажи"
      ingest_text: "добавить временный текстовый фрагмент"
    guardrails:
      citations_required: "Каждое утверждение должно иметь passage_id и цитату из вывода инструмента."
      no_invented_quotes: "Не цитируйте текст, который не вернул инструмент. Проверяйте цитаты через find_quote."
      verified_only: "verified=false, fuzzy-совпадения и no_evidence считайте отсутствием доказательства, а не подтверждением."
      text_warning: "Цитаты, подтверждённые только по текстовому фрагменту, имеют предупреждение и не являются доказательством из книги."
      graph_descriptive: "Связи графа извлечены по правилам. Confidence — уверенность извлечения, а не истинность."
      no_evaluation: "Сервер не оценивает качество книги, идей или истинность. Не просите его об этом."
      no_answer: "Сервер извлекает доказательства; ответ пишет бот."
      report_gaps: "Явно сообщайте об отсутствующих доказательствах и пустых результатах, не заполняйте пробелы."
      separate_citations: "При сравнении документов сохраняйте цитаты раздельно и не объединяйте пассажи разных книг в одну цитату."
      pagination: "Следуйте next_offset, next_cursor и limit, не считайте, что весь результат пришёл за один вызов."
    triage:
      title: "Триаж корпуса"
      description: "Составить карту документов в памяти и их структуры перед глубоким поиском."
      when: "Пользователь спрашивает, что доступно, какую книгу открыть или с чего начать."
      stop_when: "Список документов и нужный план известны."
      output: "Карта документов, путей глав и один конкретный следующий шаг поиска."
    fact_lookup:
      title: "Поиск факта или тезиса"
      description: "Найти пассажи, где заявлен или обсуждается нужный факт или тезис."
      when: "Пользователь спрашивает, что книга говорит о теме, человеке, событии или утверждении."
      stop_when: "Два-три релевантных пассажа прочитаны в контексте, их цитаты зафиксированы."
      output: "Ранжированные пассажи с цитатами и смещениями; без синтеза сверх сказанного в пассажах."
    quote_verification:
      title: "Проверка цитаты"
      description: "Проверить, есть ли цитата в разобранной книге, прежде чем её использовать."
      when: "Пользователь даёт цитату, атрибуцию или спрашивает, есть ли фраза в книге."
      stop_when: "Каждое вхождение помечено как подтверждённое или отсутствующее, со смещениями."
      output: "Вхождения с verified, match_type, смещениями, quote_hash и источником; отсутствие доказательства указано явно."
    chapter_study:
      title: "Изучение главы"
      description: "Прочитать главу или раздел по порядку и собрать её доказательства."
      when: "Пользователь просит объяснить, пересказать или разобрать одну главу или раздел."
      stop_when: "Нужный диапазон главы прочитан, релевантные пассажи процитированы."
      output: "Упорядоченные пассажи с цитатами и путями глав, плюс состояние пагинации."
    entity_profile:
      title: "Профиль сущности"
      description: "Собрать упоминания, связи и связанные кейсы для одной сущности."
      when: "Пользователь спрашивает, кто или что такое сущность и где она встречается."
      stop_when: "Упоминания и прямые связи прочитаны, самые сильные доказательства открыты."
      output: "Сводка сущности, упоминания, связи по правилам и связанные кейсы с доказательствами."
    concept_chain:
      title: "Цепочка понятий"
      description: "Проследить путь между двумя понятиями по правилам, с доказательствами."
      when: "Пользователь спрашивает, как одно понятие ведёт к другому или что их связывает."
      stop_when: "Цепочка найдена либо её отсутствие подтверждено и явно указано."
      output: "Узлы и рёбра цепочки с предикатами, confidence, доказательствами и полнотой."
    case_collection:
      title: "Сбор кейсов"
      description: "Найти примеры, иллюстрации и кейсы по маркерам."
      when: "Пользователь просит примеры или кейсы по теме или сущности."
      stop_when: "Кейсы-кандидаты открыты, их пассажи процитированы."
      output: "Кейсы с kind, маркерами, passage_ids, цитатами и связанными сущностями."
    cross_book_comparison:
      title: "Сравнение книг"
      description: "Сравнить, как несколько документов трактуют одну тему, не смешивая доказательства."
      when: "Пользователь просит сравнить книги, авторов или главы по одному вопросу."
      stop_when: "По каждому документу есть свои пассажи и цитаты по общей теме."
      output: "Доказательства по каждому документу с раздельными цитатами и явными пробелами."
    evidence_pack:
      title: "Пакет доказательств"
      description: "Собрать набор доказательств только для поиска, под большой анализ."
      when: "Пользователю нужен материал для эссе, обзора или решения, а не готовый ответ."
      stop_when: "Основные запросы пролистаны, нужные главы и кейсы открыты."
      output: "Структурированный список пассажей, цитат, кейсов и связей плюс оставшиеся пробелы."
    notes_cross_check:
      title: "Сверка заметок"
      description: "Сравнить заметки или тезис с книгой и отделить доказательства из книги от текстовых фрагментов."
      when: "Пользователь приносит заметки, черновик или тезис для проверки по книге."
      stop_when: "Каждый тезис помечен как доказательство из книги, только текстовое или отсутствующее."
      output: "Тезисы, сопоставленные с подтверждёнными вхождениями в книге или с явным отсутствием доказательств."
  cli:
    usage: 'Использование: bookworm-mcp [параметры]'
    version: Показать версию и выйти
    max_inline_bytes: Максимальный размер встроенного текста
    default_ttl: Время жизни встроенного текста по умолчанию
    locale: Язык интерфейса (en, ru)
    http: Запустить MCP по HTTP и HTTPS вместо stdio
    https: "Также слушать по TLS (по умолчанию да; отключить: --no-https)"
    host: Хост HTTP-сервера (по умолчанию 127.0.0.1)
    port: Порт HTTP-сервера (по умолчанию 9292)
    https_port: Порт HTTPS-сервера (по умолчанию 9443)
    path: Путь MCP endpoint (по умолчанию /mcp)
    allowed_hosts: Дополнительные разрешённые Host через запятую
    ssl_cert: Путь к TLS-сертификату в PEM
    ssl_key: Путь к TLS-ключу в PEM
    help: Показать справку
  http:
    listening: "MCP-сервер Bookworm слушает %{url}"
    self_signed: "TLS-сертификат не задан; используется сгенерированный self-signed сертификат."
  tools:
    ingest_book:
      title: Загрузить книгу
      description: Разобрать локальную книгу EPUB, PDF, FB2, DjVu, Markdown или TXT
        в поисковый документ в памяти.
    ingest_books:
      title: Загрузить книги
      description: Разобрать несколько локальных книг за один вызов. Для каждого
        файла возвращаются метаданные документа и признак кэша или ошибка файла.
    ingest_text:
      title: Загрузить текстовый фрагмент
      description: Создать временный документ в памяти из встроенного текста, локального
        текстового файла или URL HTTP(S). Подходит для пассажа, статьи или фрагмента,
        который не является книгой.
    list_documents:
      title: Список документов
      description: Показать книги и текстовые фрагменты, которые сейчас находятся
        в памяти.
    get_document:
      title: Получить документ
      description: Вернуть метаданные документа и краткое оглавление.
    get_outline:
      title: Получить оглавление
      description: Вернуть дерево глав и разделов книги или текстового фрагмента.
        Для компактного ответа используйте max_nodes и titles_only.
    read_passage:
      title: Прочитать пассаж
      description: Прочитать пассаж по идентификатору, при необходимости с соседними
        пассажами, цитатой и связанными сносками.
    read_chapter:
      title: Прочитать главу
      description: Прочитать все пассажи главы или раздела по node_id, с необязательными
        offset и limit. Возвращает цитаты, диапазоны и сноски.
    search:
      title: Поиск
      description: Лексический поиск по книге, текстовому фрагменту или всем документам
        в памяти. Эмбеддингов нет; семантический и векторный поиск отключён. Возвращает
        ранжированные пассажи с цитатами. Для компактного ответа используйте
        verbosity=compact. Не генерирует готовый ответ.
    find_quote:
      title: Найти цитату
      description: Найти точную или нормализованную цитату в одном документе или во
        всех документах. Возвращает смещения и признак проверки.
    delete_document:
      title: Удалить документ
      description: Удалить документ из памяти.
    stats:
      title: Статистика сервера
      description: Вернуть количество документов и пассажей в памяти.
    search_entities:
      title: Поиск сущностей
      description: Найти извлечённые имена, термины и аббревиатуры в документах в
        памяти.
    get_entity:
      title: Получить сущность
      description: Вернуть профиль сущности с упоминаниями, цитатами, связями и связанными
        примерами.
    get_relations:
      title: Получить связи
      description: Вернуть граф связей вокруг сущности или по всему документу. Поддерживает
        JSON и PlantUML. Связи ниже min_confidence не возвращаются; значение по
        умолчанию 0.5 отсекает слабые CO_OCCURS.
    get_logical_chain:
      title: Получить логическую цепочку
      description: Найти кратчайшую цепочку между двумя сущностями с доказательствами.
        Поддерживает JSON и PlantUML. Связи ниже min_confidence не учитываются.
    find_cases:
      title: Найти кейсы
      description: Найти примеры, иллюстрации, анекдоты и кейсы по маркеру, запросу
        или сущности-якорю.
    get_case:
      title: Получить кейс
      description: Вернуть один пример или кейс с доказательством, цитатой и связанными
        сущностями.
